name: Check Library Updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-libs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Install SVN
        run: sudo apt-get install -y subversion

      - name: Fetch latest libraries
        run: |
          # CurseForge SVN libs
          svn export --force https://repos.curseforge.com/wow/libstub/trunk /tmp/LibStub
          svn export --force https://repos.curseforge.com/wow/callbackhandler/trunk/CallbackHandler-1.0 /tmp/CallbackHandler-1.0
          svn export --force https://repos.curseforge.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0 /tmp/LibSharedMedia-3.0
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceDB-3.0 /tmp/AceDB-3.0
          svn export --force https://repos.curseforge.com/wow/libdbicon-1-0/trunk/LibDBIcon-1.0 /tmp/LibDBIcon-1.0

          # Ace3 LICENSE covers AceDB-3.0, CallbackHandler-1.0, and LibDBIcon-1.0
          # (same Ace3 Development Team, same BSD-style notice).
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/LICENSE.txt /tmp/ace3-LICENSE.txt
          cp /tmp/ace3-LICENSE.txt /tmp/AceDB-3.0/LICENSE.txt
          cp /tmp/ace3-LICENSE.txt /tmp/CallbackHandler-1.0/LICENSE.txt
          cp /tmp/ace3-LICENSE.txt /tmp/LibDBIcon-1.0/LICENSE.txt

          # GitHub libs
          git clone --depth 1 https://github.com/Stanzilla/LibCustomGlow.git /tmp/LibCustomGlow-1.0-repo
          mkdir -p /tmp/LibCustomGlow-1.0
          cp /tmp/LibCustomGlow-1.0-repo/LibCustomGlow-1.0.lua /tmp/LibCustomGlow-1.0/
          cp /tmp/LibCustomGlow-1.0-repo/LICENSE /tmp/LibCustomGlow-1.0/LICENSE.txt

          git clone --depth 1 https://github.com/tekkub/libdatabroker-1-1.git /tmp/LibDataBroker-1.1-repo
          mkdir -p /tmp/LibDataBroker-1.1
          cp /tmp/LibDataBroker-1.1-repo/LibDataBroker-1.1.lua /tmp/LibDataBroker-1.1/

          git clone --depth 1 https://github.com/Adirelle/LibDualSpec-1.0.git /tmp/LibDualSpec-1.0-repo
          mkdir -p /tmp/LibDualSpec-1.0
          # Strip @do-not-package@ blocks (test code not meant for distribution)
          sed '/@do-not-package@/,/@end-do-not-package@/d' /tmp/LibDualSpec-1.0-repo/LibDualSpec-1.0.lua > /tmp/LibDualSpec-1.0/LibDualSpec-1.0.lua

          git clone --depth 1 https://github.com/BigWigsMods/LibSpecialization.git /tmp/LibSpecialization-repo
          mkdir -p /tmp/LibSpecialization
          cp /tmp/LibSpecialization-repo/LibSpecialization/LibSpecialization.lua /tmp/LibSpecialization/

          git clone --depth 1 https://github.com/SafeteeWoW/LibDeflate.git /tmp/LibDeflate-repo
          mkdir -p /tmp/LibDeflate
          cp /tmp/LibDeflate-repo/LibDeflate.lua /tmp/LibDeflate/
          cp /tmp/LibDeflate-repo/LICENSE.txt /tmp/LibDeflate/

      - name: Verify every vendored lib has a fetch step
        run: |
          # Each Libs/<name>/ must have a /tmp/<name>/ populated by the fetch step.
          # Catches "added a new lib to Libs/ but forgot to update the fetch step".
          failed=
          for d in Libs/*/; do
            lib=$(basename "$d")
            if [ ! -d "/tmp/$lib" ]; then
              echo "::error::Libs/$lib has no fetch step in 'Fetch latest libraries'"
              failed=1
            fi
          done
          [ -z "$failed" ]

      - name: Check for updates
        id: diff
        run: |
          updated=""

          # Iterate every vendored lib folder and compare each file against its upstream
          # counterpart. Files we ship without an upstream copy (e.g. our hand-shipped
          # LGPL text for LibSharedMedia-3.0) are skipped naturally.
          for d in Libs/*/; do
            lib=$(basename "$d")
            changed=false
            for bundled in Libs/$lib/*; do
              [ -f "$bundled" ] || continue
              fname=$(basename "$bundled")
              if [ -f "/tmp/$lib/$fname" ] && ! diff -q "$bundled" "/tmp/$lib/$fname" > /dev/null 2>&1; then
                cp "/tmp/$lib/$fname" "$bundled"
                changed=true
              fi
            done
            if [ "$changed" = true ]; then
              updated="$updated $lib"
            fi
          done

          updated=$(echo "$updated" | xargs)
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      - name: Create PR if updates found
        if: steps.diff.outputs.updated != ''
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update embedded libs (${{ steps.diff.outputs.updated }})"
          title: "chore: update embedded libs (${{ steps.diff.outputs.updated }})"
          body: |
            Automated weekly check found updates for: **${{ steps.diff.outputs.updated }}**

            Please review the diff to make sure nothing breaking changed.
          branch: chore/update-libs
          delete-branch: true

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_LIBS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_LIBS_WEBHOOK_URL secret not set; skipping notification"
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\": \"check-libs workflow failed: $RUN_URL\"}" \
            "$WEBHOOK"
